server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/registration
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

huggingface:
  api-url: ${HUGGINGFACE_API_URL:https://router.huggingface.co/v1/chat/completions}
  api-token: ${HUGGINGFACE_API_TOKEN:}
  model: ${HUGGINGFACE_MODEL:katanemo/Arch-Router-1.5B:hf-inference}
  max-tokens: ${HUGGINGFACE_MAX_TOKENS:180}
  temperature: ${HUGGINGFACE_TEMPERATURE:0.7}
  system-prompt: ${HUGGINGFACE_SYSTEM_PROMPT:Jestes nauczycielem jezyka angielskiego. Odpowiadaj krotko, jasno i edukacyjnie.}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-change-me-change-me-change-me}
  expirationSeconds: 3600
