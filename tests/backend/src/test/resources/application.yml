spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: localhost
    port: 25

huggingface:
  api-url: https://fake-api.test/v1/chat/completions
  api-token: test-token
  model: test-model
  max-tokens: 50
  temperature: 0.5
  system-prompt: "Test system prompt"

jwt:
  secret: test-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha
  expirationSeconds: 3600

server:
  error:
    include-message: always
    include-binding-errors: always
